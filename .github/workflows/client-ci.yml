name: Client SDK CI

# Builds and tests @streetjs/client (zero-dependency, framework-agnostic SDK).
# Offline only — no services needed.

on:
  push:
    paths:
      - 'packages/client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'packages/client/**'
  workflow_dispatch:

permissions:
  contents: read

# ── Concurrency ────────────────────────────────────────────────
concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Build @streetjs/client
        run: npm run build -w packages/client
      - name: Type-check (no emit)
        run: npm run lint -w packages/client
      - name: Unit tests
        run: npm test -w packages/client
