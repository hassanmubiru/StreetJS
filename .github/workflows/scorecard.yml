# OpenSSF Scorecard — supply-chain security analysis.
# Publishes results so the README badge (api.securityscorecards.dev) and the
# viewer (securityscorecards.dev/viewer/?uri=github.com/hassanmubiru/StreetJS)
# resolve. Without a published run the viewer reports "invalid repo path".
name: Scorecard supply-chain security

on:
  # Re-run when branch protection rules change (Scorecard reads them).
  branch_protection_rule:
  schedule:
    - cron: '27 7 * * 1'   # weekly, Monday 07:27 UTC
  push:
    branches: [ "main" ]

# Least-privilege default; the analysis job elevates only what it needs.
permissions: read-all

# ── Concurrency ────────────────────────────────────────────────
# Group per-commit and never cancel: each push/scheduled run must complete so the
# security posture is recorded per commit (rapid merges must not cancel each other).
concurrency:
  group: scorecard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results SARIF to the code-scanning dashboard.
      security-events: write
      # Needed to publish results to the OpenSSF API (badge data) via OIDC.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results makes the badge/viewer data available publicly.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
